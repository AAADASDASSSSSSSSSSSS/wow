server.port=8080
spring.application.name=ratsnest-control-plane

# H2 file database (Postgres arrives with the compose/k8s deployment)
spring.datasource.url=jdbc:h2:file:./data/ratsnest;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Agent runtime dispatch (dev profile: local process).
# Override via env RATSNEST_PYTHON_EXE / RATSNEST_AGENT_RUNTIME_DIR in docker.
ratsnest.python-exe=${RATSNEST_PYTHON_EXE:E:/agent-service-toolkit-main/kicad-happy-main/RatsNest/.venv/Scripts/python.exe}
ratsnest.agent-runtime-dir=${RATSNEST_AGENT_RUNTIME_DIR:E:/agent-service-toolkit-main/kicad-happy-main/RatsNest/agent-runtime}
ratsnest.self-url=${RATSNEST_SELF_URL:http://localhost:8080}
